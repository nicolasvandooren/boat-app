name: Backend

# Runs only when something the backend checks read has changed. A workflow that does not run reports no checks,
# so required status checks from it would stay Pending (see CLAUDE.md, "CI").
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # Spotless formats Java only, so backend Markdown changes nothing the checks validate.
      - "!backend/**.md"
      - ".github/workflows/backend.yml"
  pull_request:
    # Keep identical to the push paths above.
    paths:
      - "backend/**"
      # Spotless formats Java only, so backend Markdown changes nothing the checks validate.
      - "!backend/**.md"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check formatting
        run: ./mvnw -B spotless:check
      - name: Test and package
        run: ./mvnw -B verify

  docker:
    # Same check name as the former matrix leg in ci.yml.
    name: Docker images (backend)
    runs-on: ubuntu-24.04
    needs: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: false
          tags: boatapp-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
