name: Frontend

# Runs only when something the frontend checks read has changed. A workflow that does not run reports no checks,
# so required status checks from it would stay Pending (see CLAUDE.md, "CI").
on:
  push:
    branches: [main]
    paths:
      # Includes frontend/README.md and other Markdown: `prettier --check .` formats them.
      - "frontend/**"
      # Prettier reads .editorconfig for options .prettierrc.json does not set.
      - ".editorconfig"
      - ".github/workflows/frontend.yml"
  pull_request:
    # Keep identical to the push paths above.
    paths:
      # Includes frontend/README.md and other Markdown: `prettier --check .` formats them.
      - "frontend/**"
      # Prettier reads .editorconfig for options .prettierrc.json does not set.
      - ".editorconfig"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (format, lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build

  docker:
    # Same check name as the former matrix leg in ci.yml.
    name: Docker images (frontend)
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          push: false
          tags: boatapp-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
