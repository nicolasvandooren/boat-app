server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API calls stay same-origin for the browser; nginx forwards them to the backend container.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Vite emits content-hashed file names under /assets: cache them for a year, and never fall back to
  # index.html (a missing script must be a 404, not HTML with status 200).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routing: unknown paths serve the SPA entry point. HTML is always revalidated so a new
  # deployment is picked up instead of a heuristically cached index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
